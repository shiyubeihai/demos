<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>高中英语连线消消乐</title>
<style>
  :root{
    --bg:#F4EEFB; --panel:#FFFDF8; --line:#E3DAC8; --ink:#2C2A26; --muted:#8C8577;
    --lavender:#6D3FA3; --lavender-soft:#F2ECFA; --lavender-line:#D5C4EC; --lavender-shadow:rgba(109,63,163,.24);
    --beige:#9A7433; --beige-soft:#FCF4DF; --beige-line:#EAD6AE; --beige-shadow:rgba(154,116,51,.24);
    --green:#2E8B57; --green-soft:#F1F8F3; --green-line:#B7D8C2; --green-shadow:rgba(46,139,87,.20);
    --red:#C0392B;
    --accent:var(--lavender); --accent-soft:var(--lavender-soft); --accent-line:var(--lavender-line); --accent-shadow:var(--lavender-shadow);
  }
  body[data-mode="word"]{
    --bg:#F4EEFB;
    --accent:var(--lavender); --accent-soft:var(--lavender-soft); --accent-line:var(--lavender-line); --accent-shadow:var(--lavender-shadow);
  }
  body[data-mode="phrase"]{
    --bg:#FBF3DC;
    --accent:var(--beige); --accent-soft:var(--beige-soft); --accent-line:var(--beige-line); --accent-shadow:var(--beige-shadow);
  }
  body[data-mode="review"]{
    --bg:#F7F8F2;
    --accent:var(--green); --accent-soft:var(--green-soft); --accent-line:var(--green-line); --accent-shadow:var(--green-shadow);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:radial-gradient(900px 500px at 50% -10%, #FFFDF7 0%, var(--bg) 60%);
    color:var(--ink); font-family:"PingFang SC","Helvetica Neue",Arial,sans-serif;
    min-height:100vh; padding:14px 12px 22px;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{max-width:760px; margin:0 auto}

  header{display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin-bottom:10px}
  h1{font-size:18px; margin:0; color:var(--accent); letter-spacing:.5px; flex:1 1 100%}
  h1 span{font-size:11px; color:var(--muted); font-weight:400; margin-left:6px}
  h1 b{font-weight:700; color:var(--muted)}

  .modes{display:flex; gap:6px; flex:1 1 auto; flex-wrap:wrap}
  .mode{
    border:1px solid var(--line); background:var(--panel); color:var(--muted);
    border-radius:999px; padding:7px 12px; font-size:13px; font-weight:600; cursor:pointer;
    font-family:inherit;
  }
  .mode.on{background:var(--accent); border-color:var(--accent); color:#fff}

  .stats{display:flex; flex-wrap:wrap; gap:8px 12px; font-size:12px; color:var(--muted)}
  .stats b{color:var(--ink); font-size:14px; margin-left:3px}
  #score{color:var(--accent)}
  #combo{color:var(--green)}

  .hint{font-size:12.5px; color:var(--muted); margin:4px 0 10px; min-height:18px}

  .board{
    position:relative; display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr);
    gap:10px 14px; padding:6px 2px;
  }
  #lines{position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible}
  .col{display:flex; flex-direction:column; gap:9px; min-width:0}

  .tile{
    width:100%; min-height:58px; display:flex; align-items:center;
    padding:10px 12px; border-radius:14px; cursor:pointer;
    background:var(--panel); border:1px solid var(--line);
    font-family:inherit; font-size:clamp(14px,4vw,17px); line-height:1.25;
    color:var(--ink); text-align:left; min-width:0;
    overflow-wrap:anywhere; user-select:none;
    transition:transform .12s, box-shadow .12s, border-color .12s, background .12s, opacity .2s;
    box-shadow:0 2px 6px rgba(120,100,60,.06);
  }
  .tile:active{transform:scale(.985)}
  .tile.en{
    font-weight:600; border-left:4px solid var(--accent); color:#3B2E4F;
    flex-direction:column; align-items:flex-start; justify-content:center;
    gap:1px; padding-top:8px; padding-bottom:8px;
  }
  .tile .word{line-height:1.2}
  .tile .pos{
    font-size:10.5px; font-weight:500; line-height:1.1;
    color:#7C766B; letter-spacing:.2px;
  }
  .tile.zh{color:#4a4438}
  .tile.sel{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-shadow)}
  .tile.ok{border-color:var(--green); background:#F1F8F3}
  .tile.bad{animation:shake .35s; border-color:var(--red); background:#FDF1EF}
  .tile.gone{opacity:0; transform:scale(.94); pointer-events:none}
  @keyframes shake{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-5px)}
    40%{transform:translateX(5px)}
    60%{transform:translateX(-3px)}
    80%{transform:translateX(3px)}
  }

  .bar{display:flex; align-items:center; justify-content:space-between; gap:10px; margin-top:14px}
  .progress{font-size:12.5px; color:var(--muted)}
  .progress b{color:var(--accent)}
  .bar-actions{display:flex; gap:8px}
  .restart{
    border:1px solid var(--line); background:var(--panel); color:var(--ink);
    border-radius:10px; padding:8px 14px; font-size:13px; font-weight:600; cursor:pointer;
    font-family:inherit; display:inline-flex; align-items:center; gap:6px;
  }
  .restart:hover{background:#F4EEDF}
  .restart.has-err{border-color:#E0B990; background:#FFF7EC}
  .badge{
    display:inline-flex; align-items:center; justify-content:center;
    min-width:18px; height:18px; padding:0 5px; border-radius:999px;
    background:#E8871E; color:#fff; font-size:11px; font-weight:700;
  }

  .foot{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:12px}
  .chip{
    border:1px solid var(--line); background:var(--panel); color:var(--muted);
    border-radius:999px; padding:6px 12px; font-size:12.5px; cursor:pointer;
    font-family:inherit; font-weight:600;
  }
  .chip.on{color:var(--accent); border-color:var(--accent-line); background:var(--accent-soft)}
  .foot-note{font-size:11.5px; color:var(--muted)}

  .done{
    position:fixed; left:50%; top:50%; transform:translate(-50%,-50%) scale(.9);
    background:var(--accent); color:#fff; padding:14px 22px; border-radius:14px;
    font-size:16px; font-weight:700; opacity:0; pointer-events:none;
    transition:opacity .2s, transform .2s; z-index:9; max-width:86vw; text-align:center;
  }
  .done.show{opacity:1; transform:translate(-50%,-50%) scale(1)}

  .overlay{
    position:fixed; inset:0; z-index:20; display:none; align-items:center; justify-content:center;
    padding:18px; background:rgba(43,37,25,.46);
  }
  .overlay.show{display:flex}
  .modal{
    width:min(100%,400px); max-height:92vh; overflow:auto; text-align:center;
    background:var(--panel); border:1px solid var(--line); border-radius:20px;
    padding:18px 16px 14px; box-shadow:0 20px 60px rgba(40,30,10,.28);
  }
  .modal h2{margin:0; font-size:19px; color:var(--accent)}
  .modal-head{display:flex; align-items:center; justify-content:space-between; gap:10px}
  .x{
    border:none; background:transparent; color:var(--muted); font-size:22px; line-height:1;
    cursor:pointer; padding:2px 6px; border-radius:8px;
  }
  .x:hover{background:#F4EEDF}
  .modal .sub{margin:6px 0 10px; font-size:12.5px; color:var(--muted); line-height:1.5; text-align:left}
  .modal-actions{display:flex; gap:8px; margin-top:12px}
  .modal-actions button{
    flex:1; border-radius:10px; padding:10px 12px; font:inherit; font-size:13.5px;
    font-weight:700; cursor:pointer;
  }
  .primary{border:1px solid var(--green); background:var(--green); color:#fff}
  .primary:hover{filter:brightness(.96)}
  .primary:disabled{opacity:.45; cursor:not-allowed; filter:none}
  .ghost{border:1px solid var(--line); background:var(--panel); color:var(--ink)}
  .ghost:hover{background:#F4EEDF}

  .err-list{display:flex; flex-direction:column; gap:6px; max-height:50vh; overflow:auto; text-align:left; margin:8px 0 4px}
  .err-row{display:flex; align-items:center; gap:8px; padding:7px 9px; border-radius:12px; background:#FBF7EE; border:1px solid var(--line)}
  .err-row .say,.err-row .rm{
    border:1px solid var(--line); background:#fff; border-radius:9px;
    width:34px; height:34px; cursor:pointer; font-size:14px; flex:none; line-height:1;
  }
  .err-row .say:hover,.err-row .rm:hover{background:#F4EEDF}
  .err-row .rm{color:var(--green); font-weight:700}
  .err-row .who{flex:1; min-width:0}
  .err-row .who .err-head{display:flex; align-items:baseline; gap:6px; flex-wrap:wrap}
  .err-row .who .err-head b{font-size:14.5px; color:#3B2E4F; overflow-wrap:anywhere}
  .err-row .who .err-head .pos{font-size:10px; color:var(--muted); flex:none}
  .err-row .who small{display:block; font-size:11.5px; color:var(--muted); overflow-wrap:anywhere}
  .err-row .times{font-size:11.5px; color:var(--muted); flex:none}
  .empty{padding:22px 8px; font-size:13px; color:var(--muted); line-height:1.7; text-align:center}


  .example{
    margin-top:10px; min-height:48px; padding:9px 12px;
    border-radius:12px; background:var(--accent-soft); border:1px solid var(--accent-line);
    display:flex; align-items:center; gap:10px;
  }
  .example .ex-main{flex:1; min-width:0}
  .example .ex-word{font-size:13px; font-weight:700; color:var(--accent); line-height:1.4}
  .example .ex-word.empty{font-weight:500; color:#A39A8A}
  .example .ex-text{font-size:12.5px; color:#6B6357; line-height:1.45; margin-top:2px}
  .example .ex-text:empty{display:none}
  .example .ex-say{
    flex:none; border:1px solid var(--accent-line); background:#FFFDF8; color:var(--accent);
    border-radius:8px; padding:6px 10px; font-size:12px; cursor:pointer; font-family:inherit;
  }
  .example .ex-say:hover{background:#F4EEDF}
  .err-row .who .ex{display:block; color:#8C8577; font-size:11px; line-height:1.45; margin-top:2px}

  @media (max-width:420px){
    body{padding:10px 8px 18px}
    .tile{min-height:56px; padding:8px 9px; border-radius:12px}
    .tile.en{padding-top:6px; padding-bottom:6px}
    .tile .pos{font-size:10px}
    .stats{gap:9px}
    .bar{flex-wrap:wrap}
    .bar-actions{width:100%; justify-content:flex-end}
  }
</style>
</head>
<body data-mode="word">
<div class="wrap">
  <header>
    <h1>高中英语连线消消乐 <span><b id="wordCount">0</b> 词 · <b id="phraseCount">0</b> 短语 · 免费</span></h1>
    <div class="modes">
      <button class="mode on" data-mode="word">单词</button>
      <button class="mode" data-mode="phrase">短语</button>
    </div>
    <div class="stats">
      <div>得分<b id="score">0</b></div>
      <div>连击<b id="combo">0</b></div>
      <div>正确率<b id="acc">—</b></div>
    </div>
  </header>

  <div class="hint" id="hint" aria-live="polite">把高中词汇和它的中文意思配对。点英文卡片可以听发音，配对成功会显示例句。</div>

  <div class="board" id="board">
    <svg id="lines"></svg>
    <div class="col" id="left"></div>
    <div class="col" id="right"></div>
  </div>


  <div class="example" id="example" aria-live="polite">
    <div class="ex-main">
      <div class="ex-word empty" id="exWord">配对成功后会显示例句</div>
      <div class="ex-text" id="exText"></div>
    </div>
    <button class="ex-say" id="exSay" hidden>🔊 例句</button>
  </div>

  <div class="bar">
    <div class="progress">本组 <b id="matched">0</b> / <span id="total">6</span> · 第 <b id="round">1</b> 组</div>
    <div class="bar-actions">
      <button class="restart" id="bookBtn">📕 错词本 <span class="badge" id="bookCount">0</span></button>
      <button class="restart" id="restart">重新开始</button>
    </div>
  </div>

  <div class="foot">
    <button class="chip on" id="ttsToggle">🔊 发音开</button>
    <button class="chip on" id="sfxToggle">🎵 音效开</button>
    <span class="foot-note">点英文卡片听发音 · 配对成功看例句</span>
  </div>
</div>

<div class="done" id="done" aria-live="polite"></div>

<div class="overlay" id="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="bookTitle">
    <div class="modal-head">
      <h2 id="bookTitle">错词本</h2>
      <button class="x" id="closeBook" aria-label="关闭">×</button>
    </div>
    <p class="sub" id="bookSub">配对出错时会自动记在这里。复习时配对正确，这个词就会移除。</p>
    <div class="err-list" id="errList"></div>
    <div class="modal-actions">
      <button class="primary" id="reviewBtn">复习这些词</button>
      <button class="ghost" id="clearBook">清空</button>
    </div>
  </div>
</div>

   想增删词，直接改下面的 WORD_RAW / PHRASE_RAW 即可。
========================================= */

function parseData(raw){
  const out = [];
  const seen = new Set();
  raw.split('\n').forEach(line => {
    line = line.trim();
    const parts = line.split('|');
    if(parts.length < 2) return;
    const en = parts[0].trim();
    const zh = parts[1].trim();
    const pos = (parts[2] || '').trim();
    const example = (parts[3] || '').trim();
    if(!en || !zh) return;
    const k = en.toLowerCase();
    if(seen.has(k)) return;
    seen.add(k);
    out.push({ en, zh, pos, example });
  });
  return out;
}

const PHRASES = parseData(PHRASE_RAW);

const POS_LABEL = {
  n: 'n. 名词',
  v: 'v. 动词',
  adj: 'adj. 形容词',
  adv: 'adv. 副词',
  pron: 'pron. 代词',
  prep: 'prep. 介词',
  conj: 'conj. 连词',
  art: 'art. 冠词',
  num: 'num. 数词',
  int: 'int. 感叹词',
  modal: 'modal v. 情态动词'
};

function posText(pos){
  if(!pos) return '';
  if(pos.includes('/')) return pos.split('/').map(p => (POS_LABEL[p] || p).split(' ')[0]).join('/');
  return POS_LABEL[pos] || pos;
}

/* ================= 小工具 ================= */
function esc(s){
  return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function shuffle(a){
  a = a.slice();
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

  const raw = JSON.parse(localStorage.getItem(ERR_KEY) || '[]');
  errors = Array.isArray(raw) ? raw : [];
}catch(e){ errors = []; }

function saveErrors(){
  try{ localStorage.setItem(ERR_KEY, JSON.stringify(errors)); }catch(e){}
}
function addError(en, zh, wrong, pos, example){
  if(!en || !zh) return;
  const hit = errors.find(x => String(x.en).toLowerCase() === String(en).toLowerCase());
  if(hit){
    hit.n = (hit.n || 1) + 1;
    hit.wrong = wrong || '';
    hit.zh = zh;
    if(pos) hit.pos = pos;
    if(example) hit.example = example;
    hit.ts = Date.now();
  }else{
    errors.push({ en, zh, wrong: wrong || '', pos: pos || '', example: example || '', n: 1, ts: Date.now() });
  }
  errors.sort((a, b) => (b.n || 1) - (a.n || 1) || (b.ts || 0) - (a.ts || 0));
  if(errors.length > 300) errors.length = 300;
  saveErrors();
  updateBookBadge();
}
function removeError(en){
  const key = String(en).toLowerCase();
  errors = errors.filter(x => String(x.en).toLowerCase() !== key);
  saveErrors();
  updateBookBadge();
}
function updateBookBadge(){
  $('bookCount').textContent = errors.length;
  $('bookBtn').classList.toggle('has-err', errors.length > 0);
}

/* ================= 发音（TTS） ================= */
let voices = [];
function refreshVoices(){
  try{
    voices = ('speechSynthesis' in window) ? window.speechSynthesis.getVoices() : [];
  }catch(e){ voices = []; }
}
if('speechSynthesis' in window){
  refreshVoices();
  try{ window.speechSynthesis.addEventListener('voiceschanged', refreshVoices); }catch(e){}
}
const PREFERRED_VOICE = /samantha|alex|aria|zira|google us english|google uk english female|karen|daniel/i;

function speak(text){
  if(!ttsOn || !text) return;
  if(!('speechSynthesis' in window)) return;
  try{
    const synth = window.speechSynthesis;
    if(synth.speaking || synth.pending) synth.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'en-US';
    u.rate = 0.9;
    u.pitch = 1;
    u.volume = 1;
    if(!voices.length) refreshVoices();
    const v = voices.find(x => /^en[-_]US/i.test(x.lang) && PREFERRED_VOICE.test(x.name))
      || voices.find(x => /^en[-_]US/i.test(x.lang))
      || voices.find(x => /^en/i.test(x.lang));
    if(v) u.voice = v;
    synth.speak(u);
  }catch(e){}
}

/* ================= 音效 ================= */
let ac = null;
function tone(freq, dur, type, vol){
  if(!sfxOn) return;
  try{
    if(!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if(ac.state === 'suspended') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine';
    o.frequency.value = freq;
    g.gain.setValueAtTime(vol || .05, ac.currentTime);
    g.gain.exponentialRampToValueAtTime(.0001, ac.currentTime + dur);
    o.connect(g);
    g.connect(ac.destination);
    o.start();
    o.stop(ac.currentTime + dur);
  }catch(e){}
}
function ding(c){ tone(1320 + Math.min(c, 8) * 35, .16, 'sine', .05); }
function buzz(){ tone(150, .12, 'sawtooth', .045); }

/* ================= 抽词 ================= */
function sampleFrom(pool, n, scope){
  const r = recent[scope];
  let cand = pool.filter(p => r.indexOf(p.en) === -1);
  if(cand.length < n * 4){ r.length = 0; cand = pool.slice(); }

  const picked = [], usedEn = new Set(), usedZh = new Set();
  let guard = 0;
  while(picked.length < n && guard++ < 3000){
    const p = cand[Math.floor(Math.random() * cand.length)];
    if(!p) break;
    if(usedEn.has(p.en) || usedZh.has(p.zh)) continue;
    usedEn.add(p.en);
    usedZh.add(p.zh);
    picked.push(p);
    r.push(p.en);
    if(r.length > 80) r.shift();
  }
  return picked;
}

/* ================= 渲染 ================= */
function posOf(en){
  const k = String(en).toLowerCase();
  const w = WORDS.find(x => x.en.toLowerCase() === k);
  return w ? (w.pos || '') : '';
}

function exampleOf(en){
  const k = String(en).toLowerCase();
  const w = WORDS.find(x => x.en.toLowerCase() === k);
  return w ? (w.example || '') : '';
}

function makeTile(p, idx, side){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'tile ' + (side === 'left' ? 'en' : 'zh');
  b.dataset.idx = idx;
  b.dataset.side = side;
  b.dataset.lang = side === 'left' ? 'en' : 'zh';
  b.dataset.en = p.en;
  b.dataset.zh = p.zh;
  b.dataset.pos = p.pos || '';
  b.dataset.example = p.example || '';

  if(side === 'left'){
    const word = document.createElement('span');
    word.className = 'word';
    word.textContent = p.en;
    b.appendChild(word);
    if(p.pos){
      const tag = document.createElement('span');
      tag.className = 'pos';
      tag.textContent = posText(p.pos);
      b.appendChild(tag);
    }
  }else{
    b.textContent = p.zh;
  }

  b.addEventListener('click', () => onTile(b));
  return b;
}

function buildRound(){
  gen++;
  hideToast();

  if(mode === 'review'){
    pairs = errors.slice(0, 6).map(e => ({ en: e.en, zh: e.zh, pos: e.pos || posOf(e.en), example: e.example || exampleOf(e.en) }));
    if(pairs.length < 2){
      enterMode('word', false);
      flash('错词本里的词还不够，先玩几组吧');
      return;
    }
  }else if(mode === 'phrase'){
    pairs = sampleFrom(PHRASES, 6, 'phrase');
  }else{
    pairs = sampleFrom(WORDS, 6, 'word');
  }

  pairs = pairs.map((p, i) => ({ en: p.en, zh: p.zh, pos: p.pos || '', example: p.example || '', idx: i }));

  matched = 0;
  sel = null;
  lock = false;
  leftCol.innerHTML = '';
  rightCol.innerHTML = '';
  svg.innerHTML = '';

  const left = shuffle(pairs.map((p, i) => ({ p, i })));
  const right = shuffle(pairs.map((p, i) => ({ p, i })));

  left.forEach(x => leftCol.appendChild(makeTile(x.p, x.i, 'left')));
  right.forEach(x => rightCol.appendChild(makeTile(x.p, x.i, 'right')));

  $('matched').textContent = 0;
  $('total').textContent = pairs.length;
  $('round').textContent = roundNo;
}

function updateStats(){
  $('score').textContent = score;
  $('combo').textContent = combo;
  $('matched').textContent = matched;
  const total = hits + misses;
  $('acc').textContent = total ? Math.round(hits * 100 / total) + '%' : '—';
}

/* ================= 交互 ================= */
function select(el){
  sel = el;
  el.classList.add('sel');
  if(el.dataset.lang === 'en') speak(el.dataset.en);
}
function deselect(){
  if(sel) sel.classList.remove('sel');
  sel = null;
}

function onTile(el){
  if(lock || el.classList.contains('gone')) return;
  if(!sel){ select(el); return; }
  if(sel === el){ deselect(); return; }
  if(sel.dataset.side === el.dataset.side){ deselect(); select(el); return; }
  if(sel.dataset.idx === el.dataset.idx) match(sel, el);
  else wrong(sel, el);
}

function match(a, b){
  lock = true;
  const myGen = gen;

  a.classList.add('ok');
  b.classList.add('ok');
  drawLine(a, b);

  score += 10 + Math.min(combo, 8) * 2;
  combo++;
  hits++;
  matched++;
  updateStats();
  ding(combo);

  if(mode === 'review') removeError(a.dataset.en);
  showExample(a.dataset.en, a.dataset.zh, a.dataset.example);

  setTimeout(() => {
    if(myGen !== gen) return;
    a.classList.add('gone');
    b.classList.add('gone');
    a.classList.remove('ok', 'sel');
    b.classList.remove('ok', 'sel');
    svg.innerHTML = '';
    lock = false;
    deselect();

    if(matched === pairs.length){
      roundNo++;
      completedRounds++;
      const milestone = completedRounds % 5 === 0;
      showToast(milestone ? '完成 ' + completedRounds + ' 组 · 得分 ' + score : '本组完成！');
      setTimeout(() => {
        if(myGen !== gen) return;
        hideToast();
        if(mode === 'review' && errors.length < 2){
          enterMode('word', false);
          flash('错词复习完成');
        }else{
          buildRound();
        }
      }, milestone ? 1100 : 800);
    }
  }, 420);
}

function wrong(a, b){
  lock = true;
  const myGen = gen;

  a.classList.add('bad');
  b.classList.add('bad');
  misses++;
  combo = 0;
  updateStats();
  buzz();

  const enEl = a.dataset.lang === 'en' ? a : b;
  const zhEl = enEl === a ? b : a;
  addError(enEl.dataset.en, enEl.dataset.zh, zhEl.textContent, enEl.dataset.pos, enEl.dataset.example);

  setTimeout(() => {
    if(myGen !== gen) return;
    a.classList.remove('bad', 'sel');
    b.classList.remove('bad', 'sel');
    lock = false;
    deselect();
  }, 380);
}

function drawLine(a, b){
  const board = $('board').getBoundingClientRect();
  const ar = a.getBoundingClientRect();
  const br = b.getBoundingClientRect();
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  const ax = ar.right - board.left, ay = ar.top + ar.height / 2 - board.top;
  const bx = br.left - board.left, by = br.top + br.height / 2 - board.top;
  line.setAttribute('x1', Math.min(ax, bx));
  line.setAttribute('y1', ay);
  line.setAttribute('x2', Math.max(ax, bx));
  line.setAttribute('y2', by);
  line.setAttribute('stroke', '#2E8B57');
  line.setAttribute('stroke-width', '3');
  line.setAttribute('stroke-linecap', 'round');
  line.setAttribute('opacity', '0.8');
  svg.appendChild(line);
  line.animate([{ opacity: 0 }, { opacity: .8 }], { duration: 160 });
}

/* ================= 提示 ================= */
let toastTimer = 0;
function showToast(text){
  const d = $('done');
  d.textContent = text;
  d.classList.add('show');
  clearTimeout(toastTimer);
}
function hideToast(){
  $('done').classList.remove('show');
}
function flash(text){
  showToast(text);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, 1800);
}

/* ================= 例句 ================= */
function resetExample(){
  const word = $('exWord'), text = $('exText'), say = $('exSay');
  if(!word) return;
  word.textContent = mode === 'phrase' ? '短语模式暂不显示例句' : '配对成功后会显示例句';
  word.classList.add('empty');
  text.textContent = '';
  say.hidden = true;
}
function showExample(en, zh, example){
  const word = $('exWord'), text = $('exText'), say = $('exSay');
  if(!example){
    resetExample();
    return;
  }
  word.textContent = en + (zh ? ' · ' + zh : '');
  word.classList.remove('empty');
  text.textContent = example;
  say.hidden = false;
}

/* ================= 模式 ================= */
function syncModeUI(){
  document.querySelectorAll('.mode').forEach(b => {
    b.classList.toggle('on', b.dataset.mode === mode);
  });
  document.body.dataset.mode = mode;
  $('hint').textContent = HINTS[mode] || HINTS.word;
  const ex = $('example');
  if(ex) ex.style.display = (mode === 'phrase') ? 'none' : 'flex';
  if(mode !== 'phrase') resetExample();
}

function enterMode(m, resetStats){
  mode = m;
  syncModeUI();
  if(resetStats){
    score = 0; combo = 0; hits = 0; misses = 0;
    roundNo = 1; completedRounds = 0;
    updateStats();
  }
  buildRound();
}

/* ================= 错词本界面 ================= */
function renderBook(){
  const el = $('errList');
  if(!errors.length){
    el.innerHTML = '<div class="empty">还没有错词。<br>配对出错时，会记在这里。</div>';
  }else{
    el.innerHTML = errors.map(e => {
      const wrong = e.wrong ? ' · 曾误选：' + esc(e.wrong) : '';
      const pos = e.pos || posOf(e.en);
      const example = e.example || exampleOf(e.en);
      return '<div class="err-row">' +
        '<button class="say" data-en="' + esc(e.en) + '" title="发音">🔊</button>' +
        '<div class="who">' +
          '<div class="err-head"><b>' + esc(e.en) + '</b>' +
            (pos ? '<span class="pos">' + esc(posText(pos)) + '</span>' : '') +
          '</div>' +
          '<small>' + esc(e.zh) + wrong + (example ? '<span class="ex">' + esc(example) + '</span>' : '') + '</small>' +
        '</div>' +
        '<span class="times">×' + (e.n || 1) + '</span>' +
        '<button class="rm" data-en="' + esc(e.en) + '" title="已掌握，移除">✓</button>' +
      '</div>';
    }).join('');
  }
  const canReview = errors.length >= 2;
  $('reviewBtn').disabled = !canReview;
  $('reviewBtn').textContent = canReview ? '复习这些词' : '至少需要 2 个错词';
  $('bookSub').textContent = errors.length
    ? '配对出错时会自动记在这里。复习时配对正确，这个词就会移除。'
    : '配对出错时会自动记在这里。';
  $('overlay').classList.add('show');
}
function closeBook(){
  $('overlay').classList.remove('show');
}

/* ================= 偏好按钮 ================= */
function syncPrefs(){
  $('ttsToggle').textContent = ttsOn ? '🔊 发音开' : '🔇 发音关';
  $('ttsToggle').classList.toggle('on', ttsOn);
  $('sfxToggle').textContent = sfxOn ? '🎵 音效开' : '🔕 音效关';
  $('sfxToggle').classList.toggle('on', sfxOn);
}

/* ================= 事件 ================= */
document.querySelectorAll('.mode').forEach(b => {
  b.addEventListener('click', () => enterMode(b.dataset.mode, true));
});

$('restart').addEventListener('click', () => enterMode(mode, true));
$('bookBtn').addEventListener('click', renderBook);
$('exSay').addEventListener('click', () => {
  const t = $('exText').textContent.trim();
  if(t) speak(t);
});
$('closeBook').addEventListener('click', closeBook);
$('overlay').addEventListener('click', e => { if(e.target === $('overlay')) closeBook(); });

$('errList').addEventListener('click', e => {
  const say = e.target.closest('.say');
  const rm = e.target.closest('.rm');
  if(say){ speak(say.dataset.en); return; }
  if(rm){ removeError(rm.dataset.en); renderBook(); }
});

$('clearBook').addEventListener('click', () => {
  if(!errors.length) return;
  if(confirm('清空整个错词本？')){
    errors = [];
    saveErrors();
    updateBookBadge();
    renderBook();
  }
});

$('reviewBtn').addEventListener('click', () => {
  if(errors.length < 2) return;
  closeBook();
  enterMode('review', true);
});

$('ttsToggle').addEventListener('click', () => {
  ttsOn = !ttsOn;
  if(!ttsOn && 'speechSynthesis' in window){
    try{ window.speechSynthesis.cancel(); }catch(e){}
  }
  savePrefs();
  syncPrefs();
});

$('sfxToggle').addEventListener('click', () => {
  sfxOn = !sfxOn;
  savePrefs();
  syncPrefs();
  if(sfxOn) ding(1);
});

document.addEventListener('keydown', e => {
  if(e.key === 'Escape' && $('overlay').classList.contains('show')) closeBook();
});
window.addEventListener('resize', () => { svg.innerHTML = ''; });

/* ================= 启动 ================= */
$('wordCount').textContent = WORDS.length;
$('phraseCount').textContent = PHRASES.length;
updateBookBadge();
syncPrefs();
enterMode('word', true);
</script>
</body>
